services:
  postgres:
    image: postgres:16
    container_name: opa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: opa_user
      POSTGRES_PASSWORD: opa_dev_password
      POSTGRES_DB: opa_db
    ports:
      - "5432:5432"
    volumes:
      - opa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opa_user -d opa_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  opa_postgres_data:
